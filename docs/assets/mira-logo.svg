<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mira-logo-title mira-logo-desc">
  <!-- Decision: Mira means "measure" (Ukrainian міра), so the mark is a gauge —
       a graduated navy arc that converges to gold, with a gold needle at rest on
       the reading. Navy/gold and the converge-to-gold gradient are the Everruns
       family language, shared with the everruns, yolop, and bashkit marks. -->
  <title id="mira-logo-title">Mira</title>
  <desc id="mira-logo-desc">A navy measuring gauge with graduated ticks and a gold needle.</desc>
  <defs>
    <linearGradient id="mira-scale" x1="86" y1="256" x2="426" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1636"/>
      <stop offset="0.62" stop-color="#0A1636"/>
      <stop offset="1" stop-color="#D4A43A"/>
    </linearGradient>
  </defs>

  <!-- Graduated arc -->
  <path
    d="M86 256 A170 170 0 0 1 426 256"
    stroke="url(#mira-scale)"
    stroke-width="22"
    stroke-linecap="round"
  />

  <!-- Ticks -->
  <g stroke="#0A1636" stroke-width="14" stroke-linecap="round">
    <path d="M108.8 171.0 L139.9 189.0"/>
    <path d="M171.0 108.8 L189.0 139.9"/>
    <path d="M256 86 L256 122"/>
    <path d="M341.0 108.8 L323.0 139.9"/>
    <path d="M403.2 171.0 L372.1 189.0"/>
  </g>

  <!-- Needle at rest on the reading -->
  <path
    d="M256 256 L302.4 141.1"
    stroke="#D4A43A"
    stroke-width="26"
    stroke-linecap="round"
  />
  <circle cx="256" cy="256" r="18" fill="#0A1636"/>
</svg>
