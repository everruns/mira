name: Live judges

# The mira-judge live tests call the real OpenAI and Anthropic APIs, so they
# cost money and never run on PRs. They run weekly and on demand, and a
# missing key or an API error fails the run instead of skipping it.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-judges:
    name: Live judges (mira-judge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      # Keys stay inside `doppler run`; they never pass through GITHUB_ENV.
      - name: Run live judge tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- cargo test -p mira-judge --features live-tests --test live_judges -- --nocapture
