[package]
name = "mira-everruns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/mira-everruns"
description = "Mira Subject adapter for the Everruns Framework: evaluate in-process agent sessions"
readme = "README.md"

[dependencies]
mira-eval.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# Drivers behind `target_to_model` (the providers a Target can name).
everruns = { workspace = true, features = ["anthropic", "openai", "gemini", "openrouter"] }
everruns-core.workspace = true

[dev-dependencies]
# Typed ids for constructing events in the fold tests.
everruns-contracts = "0.53"
tokio.workspace = true
